info:
  version: 1.0.0

## Properties for Spring itself
spring:
  application:
    name: albeniz-api
  datasource:
    url: jdbc:postgresql://localhost:5432/albeniz_db
    driverClassName: org.postgresql.Driver
    username: myDatabaseAdminUser
    password: aGivenAdminPassword
  jpa:
    hibernate:
      ddl-auto: none
    show-sql: true
    database-platform: org.hibernate.dialect.PostgreSQLDialect

# Change Actuator base URI
management:
  endpoints:
    web:
      base-path: /tooling
      exposure:
        include: "health,info"

# Liquibase
liquibase:
  user: myDatabaseAdminUser
  password: aGivenAdminPassword

## Change Server base context
server:
  error.whitelabel.enabled: false
  servlet:
    context-path: /albeniz

application:
  api:
    maxCollection: 11
    ascending: false
